# Hand-curated conda environment for the SBI benchmark repository.
# Usage:  conda env create -f environment/environment.yml
name: sbi-summary
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - numpy=2.3.5
  - scipy=1.18.0
  - pandas=2.3.3
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - scikit-learn=1.8.0
  - pip
  - pip:
      - torch==2.10.0
      - sbi==0.26.1
      - bayesflow==2.0.8
      - keras==3.13.2
      - pyabc==0.12.16
      - pot==0.9.6.post1
      - jupyter==1.1.1
