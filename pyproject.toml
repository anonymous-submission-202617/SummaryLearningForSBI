[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbi-benchmark"
version = "0.1.0"
description = "Simulation-based inference benchmarks: SMMD, MMD, BayesFlow, DNNABC, NPE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "torch",
    "matplotlib",
    "seaborn",
    "pandas",
    "sbi",
    "bayesflow",
    "keras",
    "pyabc",
    "pot",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["sbi_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
